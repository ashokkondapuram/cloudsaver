# Run with --env-file <generated>/keycloak.env; keep generated secrets outside Git.
name: cloudsaver-keycloak
services:
  database:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?Required}
    volumes: [database:/var/lib/postgresql/data]
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U keycloak -d keycloak']
      interval: 10s
      timeout: 5s
      retries: 12
    networks: [private]
  keycloak:
    image: quay.io/keycloak/keycloak:26.4.0
    restart: unless-stopped
    command: [start, --import-realm]
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://database:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?Required}
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USER:-bootstrap-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?Required}
      KC_HOSTNAME: ${KEYCLOAK_PUBLIC_URL:?Required HTTPS URL}
      KC_HTTP_ENABLED: 'false'
      KC_HTTPS_CERTIFICATE_FILE: /run/tls/cert.pem
      KC_HTTPS_CERTIFICATE_KEY_FILE: /run/tls/key.pem
      KC_HEALTH_ENABLED: 'true'
      KC_METRICS_ENABLED: 'true'
      KC_HTTP_MANAGEMENT_SCHEME: http
    ports: ['${KEYCLOAK_BIND_ADDRESS:-127.0.0.1}:${KEYCLOAK_PORT:-8443}:8443']
    volumes:
      - ${KEYCLOAK_IMPORT_DIR:?Required}:/opt/keycloak/data/import:ro
      - ${KEYCLOAK_TLS_CERT:?Required}:/run/tls/cert.pem:ro
      - ${KEYCLOAK_TLS_KEY:?Required}:/run/tls/key.pem:ro
    depends_on:
      database: {condition: service_healthy}
    healthcheck:
      test: [CMD, bash, -ec, 'exec 3<>/dev/tcp/127.0.0.1/9000; printf "GET /health/ready HTTP/1.0\r\n\r\n" >&3; head -1 <&3 | grep -q "200"']
      interval: 15s
      timeout: 5s
      start_period: 90s
      retries: 12
    networks: [private, egress]
networks:
  private: {internal: true}
  egress: {}
volumes:
  database:
