name: cloudsaver

x-environment: &environment
  CLOUDSAVER_INTERACTIVE_JOBS: ${CLOUDSAVER_INTERACTIVE_JOBS:-false}
  CLOUDSAVER_ALLOWED_ORIGINS: ${CLOUDSAVER_ALLOWED_ORIGINS:-}
  CLOUDSAVER_DB_POOL_SIZE: ${CLOUDSAVER_DB_POOL_SIZE:-2}
  CLOUDSAVER_DB_MAX_OVERFLOW: ${CLOUDSAVER_DB_MAX_OVERFLOW:-3}
  CLOUDSAVER_DB_POOL_TIMEOUT: ${CLOUDSAVER_DB_POOL_TIMEOUT:-5}
  CLOUDSAVER_DB_POOL_RECYCLE: ${CLOUDSAVER_DB_POOL_RECYCLE:-1800}
  CLOUDSAVER_MODE: ${CLOUDSAVER_MODE:-azure}
  # Bootstrap seed only: rows are inserted once; the dashboard owns them afterwards.
  CLOUDSAVER_TENANTS: ${CLOUDSAVER_TENANTS:-[]}
  CLOUDSAVER_TENANT_REGISTRY: database
  CLOUDSAVER_DATABASE_URL: postgresql://cloudsaver_app:${CLOUDSAVER_DB_PASSWORD:?Set URL-safe CLOUDSAVER_DB_PASSWORD in .env}@postgres:5432/cloudsaver
  SCANNER_SERVICE_URL: http://scanner-service:8002
  CLOUDSAVER_AUTH_MODE: ${CLOUDSAVER_AUTH_MODE:-workspace}
  CLOUDSAVER_ENTRA_AUDIENCE: ${CLOUDSAVER_ENTRA_AUDIENCE:-}
  # Seeds for the platform settings row; change them later in the platform portal.
  CLOUDSAVER_SCHEDULED_SCANS: ${CLOUDSAVER_SCHEDULED_SCANS:-false}
  CLOUDSAVER_AUTOMATED_ALERTS: ${CLOUDSAVER_AUTOMATED_ALERTS:-false}
  # Keyless cloud identity (non-secret identifiers only).
  CLOUDSAVER_CLOUD_IDENTITY: ${CLOUDSAVER_CLOUD_IDENTITY:-managed_identity}
  AZURE_CLIENT_ID: ${AZURE_MANAGED_IDENTITY_CLIENT_ID:-}
  CLOUDSAVER_AZURE_ACCESS: ${CLOUDSAVER_AZURE_ACCESS:-federated}
  CLOUDSAVER_AZURE_APP_CLIENT_ID: ${CLOUDSAVER_AZURE_APP_CLIENT_ID:-}
  CLOUDSAVER_AWS_HUB_ROLE_ARN: ${CLOUDSAVER_AWS_HUB_ROLE_ARN:-}
  CLOUDSAVER_AWS_TOKEN_AUDIENCE: ${CLOUDSAVER_AWS_TOKEN_AUDIENCE:-api://AzureADTokenExchange}
  CLOUDSAVER_GCP_WORKLOAD_PROVIDER: ${CLOUDSAVER_GCP_WORKLOAD_PROVIDER:-}
  CLOUDSAVER_GCP_TOKEN_AUDIENCE: ${CLOUDSAVER_GCP_TOKEN_AUDIENCE:-api://AzureADTokenExchange}
  CLOUDSAVER_DELIVERY_ENABLED: ${CLOUDSAVER_DELIVERY_ENABLED:-false}
  CLOUDSAVER_NOTIFICATION_TARGETS: ${CLOUDSAVER_NOTIFICATION_TARGETS:-[]}
  # Workspace-key rollout: local -> shadow -> identity, then CLOUDSAVER_DIRECTORY_MODE=cutover.
  CLOUDSAVER_KEY_VERIFIER: ${CLOUDSAVER_KEY_VERIFIER:-shadow}
  CLOUDSAVER_DIRECTORY_MODE: ${CLOUDSAVER_DIRECTORY_MODE:-registry}
  CLOUDSAVER_PROVIDER_SCOPED_KEYS: ${CLOUDSAVER_PROVIDER_SCOPED_KEYS:-false}
  # identity-service runs in the separate "platform" compose project; reached only over platform-link.
  CLOUDSAVER_IDENTITY_URL: ${CLOUDSAVER_IDENTITY_URL:-http://identity-service:8005}
  CLOUDSAVER_IDENTITY_CACHE_SECONDS: ${CLOUDSAVER_IDENTITY_CACHE_SECONDS:-15}
  CLOUDSAVER_ENVIRONMENT: ${CLOUDSAVER_ENVIRONMENT:-development}
  CLOUDSAVER_REGIONAL_PRICE_CATALOG: ${CLOUDSAVER_REGIONAL_PRICE_CATALOG:-[]}
  CLOUDSAVER_LIVE_EVIDENCE_ENABLED: ${CLOUDSAVER_LIVE_EVIDENCE_ENABLED:-false}
  CLOUDSAVER_LIVE_EVIDENCE_MAX_RESOURCES: ${CLOUDSAVER_LIVE_EVIDENCE_MAX_RESOURCES:-25}
  CLOUDSAVER_AI_ENABLED: ${CLOUDSAVER_AI_ENABLED:-false}
  CLOUDSAVER_AI_TARGETS: ${CLOUDSAVER_AI_TARGETS:-[]}
  CLOUDSAVER_DATA_ENVIRONMENT_ID: ${CLOUDSAVER_DATA_ENVIRONMENT_ID:-}
  CLOUDSAVER_DATA_AZURE_TENANT_ID: ${CLOUDSAVER_DATA_AZURE_TENANT_ID:-}
  CLOUDSAVER_KUBERNETES_BINDINGS: ${CLOUDSAVER_KUBERNETES_BINDINGS:-[]}
  CLOUDSAVER_EVIDENCE_SOURCES: ${CLOUDSAVER_EVIDENCE_SOURCES:-[]}
  CLOUDSAVER_SAVINGS_RECONCILIATION_ENABLED: ${CLOUDSAVER_SAVINGS_RECONCILIATION_ENABLED:-false}
  CLOUDSAVER_TRUSTED_CALLERS: api-gateway
  NO_PROXY: &internal_no_proxy localhost,127.0.0.1,::1,api-gateway,scanner-service,agent-gateway,identity-service,postgres,redis
  no_proxy: *internal_no_proxy

x-service: &service
  image: cloudsaver-python:1.4.0
  build:
    context: .
    dockerfile: Dockerfile.services
    args:
      INSTALL_AZURE_CLI: ${CLOUDSAVER_INSTALL_AZURE_CLI:-false}
  restart: unless-stopped
  init: true
  read_only: true
  tmpfs: [/tmp]
  environment: *environment

x-delivery-environment: &delivery-environment
  CLOUDSAVER_WEBHOOK_PRIMARY: ${CLOUDSAVER_WEBHOOK_PRIMARY:-}

x-worker-environment: &worker-environment
  <<: [*environment, *delivery-environment]
  REDIS_URL: redis://redis:6379/1
  CLOUDSAVER_SCHEDULER_TICK_SECONDS: ${CLOUDSAVER_SCHEDULER_TICK_SECONDS:-300}
  CLOUDSAVER_AI_ENABLED: ${CLOUDSAVER_AI_ENABLED:-false}
  CLOUDSAVER_AI_TARGETS: ${CLOUDSAVER_AI_TARGETS:-[]}
  CLOUDSAVER_AI_HOURLY_ATTEMPTS: ${CLOUDSAVER_AI_HOURLY_ATTEMPTS:-10}
  CLOUDSAVER_AI_BATCH_TICK_SECONDS: ${CLOUDSAVER_AI_BATCH_TICK_SECONDS:-30}

services:
  migrate:
    <<: *service
    restart: 'no'
    command: [python, -m, alembic, upgrade, head]
    environment:
      CLOUDSAVER_MIGRATION_URL: postgresql://postgres:${POSTGRES_PASSWORD:?Set URL-safe POSTGRES_PASSWORD in .env}@postgres:5432/cloudsaver
      CLOUDSAVER_DB_PASSWORD: ${CLOUDSAVER_DB_PASSWORD:?Set URL-safe CLOUDSAVER_DB_PASSWORD in .env}
      CLOUDSAVER_REGISTRY_EXPORT_PASSWORD: ${CLOUDSAVER_REGISTRY_EXPORT_PASSWORD:-}
    depends_on:
      postgres: {condition: service_healthy}
  api-gateway:
    <<: *service
    networks: [default, platform-link]
    command: [uvicorn, services.gateway:create_app, --factory, --host, 0.0.0.0, --port, '8000']
    ports: ['127.0.0.1:8000:8000']
    environment:
      <<: *environment
      REDIS_URL: redis://redis:6379/0
      AGENT_GATEWAY_URL: http://agent-gateway:8006
      CLOUDSAVER_IDENTITY_TOKEN: ${CLOUDSAVER_IDENTITY_TOKEN_GATEWAY:-}
      CLOUDSAVER_TRUSTED_CALLERS: ''
      CLOUDSAVER_TRUSTED_PROXIES: web-dashboard
    depends_on:
      redis: {condition: service_healthy}
      scanner-service: {condition: service_healthy}
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz')"]
      interval: 15s
      timeout: 5s
      retries: 5
  scanner-service:
    <<: *service
    networks: [default, platform-link]
    command: [uvicorn, app.main:create_app, --factory, --host, 0.0.0.0, --port, '8002', --workers, '1']
    environment:
      <<: [*environment, *delivery-environment]
      CLOUDSAVER_PROMETHEUS_TOKEN_PRIMARY: ${CLOUDSAVER_PROMETHEUS_TOKEN_PRIMARY:-}
      REDIS_URL: redis://redis:6379/1
      CLOUDSAVER_DISTRIBUTED_SCAN_LOCK: 'true'
      CLOUDSAVER_AI_ENABLED: ${CLOUDSAVER_AI_ENABLED:-false}
      CLOUDSAVER_AI_TARGETS: ${CLOUDSAVER_AI_TARGETS:-[]}
      CLOUDSAVER_AI_HOURLY_ATTEMPTS: ${CLOUDSAVER_AI_HOURLY_ATTEMPTS:-10}
      CLOUDSAVER_IDENTITY_TOKEN: ${CLOUDSAVER_IDENTITY_TOKEN_SCANNER:-}
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
      migrate: {condition: service_completed_successfully}
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8002/healthz')"]
      interval: 15s
      timeout: 5s
      retries: 5
  agent-gateway:
    <<: *service
    networks: [default, platform-link]
    command: [uvicorn, services.agent_gateway:create_app, --factory, --host, 0.0.0.0, --port, '8006']
    environment:
      <<: *environment
      CLOUDSAVER_AGENT_ENABLED: ${CLOUDSAVER_AGENT_ENABLED:-false}
      CLOUDSAVER_AGENT_CONNECTORS: ${CLOUDSAVER_AGENT_CONNECTORS:-[]}
      CLOUDSAVER_AGENT_WORKERS: ${CLOUDSAVER_AGENT_WORKERS:-[]}
      CLOUDSAVER_IDENTITY_TOKEN: ${CLOUDSAVER_IDENTITY_TOKEN_AGENT:-}
    depends_on:
      migrate: {condition: service_completed_successfully}
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8006/healthz')"]
      interval: 15s
      timeout: 5s
      retries: 5
  agent-worker:
    image: cloudsaver-agent-worker:1.1.0
    build:
      context: ./agent-worker
      dockerfile: Dockerfile
    profiles: [agentic]
    restart: unless-stopped
    init: true
    user: '1000:1000'
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 128
    mem_limit: 256m
    cpus: 1.0
    stop_grace_period: 120s
    environment:
      CLOUDSAVER_ENVIRONMENT: ${CLOUDSAVER_ENVIRONMENT:-development}
      CLOUDSAVER_AGENT_GATEWAY_URL: ${CLOUDSAVER_AGENT_GATEWAY_URL:-http://agent-gateway:8006}
      CLOUDSAVER_AGENT_WORKER_TOKEN: ${CLOUDSAVER_AGENT_WORKER_TOKEN:-}
      CLOUDSAVER_AGENT_TENANT_IDS: ${CLOUDSAVER_AGENT_TENANT_IDS:-[]}
      CLOUDSAVER_AGENT_CONNECTORS: ${CLOUDSAVER_AGENT_CONNECTORS:-[]}
      CLOUDSAVER_AGENT_AZURE_IDENTITY: ${CLOUDSAVER_AGENT_AZURE_IDENTITY:-managed_identity}
      AZURE_CLIENT_ID: ${CLOUDSAVER_AGENT_AZURE_CLIENT_ID:-}
      NO_PROXY: localhost,127.0.0.1,::1,agent-gateway
      no_proxy: localhost,127.0.0.1,::1,agent-gateway
    depends_on:
      agent-gateway: {condition: service_healthy}
  web-dashboard:
    image: cloudsaver-web-dashboard:1.3.0
    build:
      context: .
      dockerfile: web-dashboard/Dockerfile
    restart: unless-stopped
    ports: ['127.0.0.1:3000:3000']
    environment:
      API_GATEWAY_URL: http://api-gateway:8000
      NO_PROXY: &gateway_no_proxy localhost,127.0.0.1,::1,api-gateway
      no_proxy: *gateway_no_proxy
    depends_on:
      api-gateway: {condition: service_healthy}
  data-retention-worker:
    <<: *service
    command: [python, -m, workers.data_retention]
    depends_on:
      migrate: {condition: service_completed_successfully}
  scan-worker:
    <<: *service
    profiles: [scheduled]
    command: [celery, -A, workers.tasks:celery_app, worker, --loglevel=WARNING, --concurrency=1]
    environment: *worker-environment
    depends_on:
      migrate: {condition: service_completed_successfully}
      redis: {condition: service_healthy}
  delivery-dispatcher:
    <<: *service
    profiles: [scheduled, delivery]
    restart: on-failure
    stop_grace_period: 45s
    command: [python, -m, workers.dispatcher]
    environment: *worker-environment
    depends_on:
      migrate: {condition: service_completed_successfully}
      redis: {condition: service_healthy}
  scan-scheduler:
    <<: *service
    profiles: [scheduled]
    command: [celery, -A, workers.tasks:celery_app, beat, --loglevel=WARNING, --schedule=/tmp/celerybeat-schedule]
    environment: *worker-environment
    depends_on:
      migrate: {condition: service_completed_successfully}
      redis: {condition: service_healthy}
  postgres:
    build:
      context: ./database
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: cloudsaver
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      CLOUDSAVER_DB_PASSWORD: ${CLOUDSAVER_DB_PASSWORD:?Set URL-safe CLOUDSAVER_DB_PASSWORD in .env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, pg_isready -U postgres -d cloudsaver]
      interval: 5s
      timeout: 5s
      retries: 10
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: [redis-server, --save, '', --appendonly, 'yes', --maxmemory, 128mb, --maxmemory-policy, noeviction]
    volumes: [redis-data:/data]
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 5s
      timeout: 5s
      retries: 10

networks:
  default:
  # Created by the platform project (platform/compose.yaml). Internal: no egress.
  platform-link:
    external: true

volumes:
  postgres-data:
  redis-data:
