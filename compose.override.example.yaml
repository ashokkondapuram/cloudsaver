# Local developer sign-in for live scans without managed identity or stored secrets.
# Windows/Docker Desktop Azure-only setup: use compose.azure-local.example.yaml
# and sign in inside the Linux container instead of mounting a Windows CLI cache.
# Copy to compose.override.yaml, set CLOUDSAVER_CLOUD_IDENTITY=developer and
# CLOUDSAVER_INSTALL_AZURE_CLI=true in .env, then sign in on the host first:
#   az login --tenant <customer tenant ID>
#   aws sso login --profile <profile>
#   gcloud auth application-default login
# Production on Azure needs none of this: attach the user-assigned managed identity.
x-developer-identity: &developer-identity
  environment:
    AWS_PROFILE: ${AWS_PROFILE:-default}
    CLOUDSAVER_PROMETHEUS_TOKEN_PRIMARY: ${CLOUDSAVER_PROMETHEUS_TOKEN_PRIMARY:-}
  volumes:
    # Azure CLI and AWS SSO refresh their token caches, so these mounts are writable.
    - ${HOME}/.azure:/home/appuser/.azure
    - ${HOME}/.aws:/home/appuser/.aws
    - ${HOME}/.config/gcloud:/home/appuser/.config/gcloud:ro

services:
  scanner-service: *developer-identity
  scan-worker: *developer-identity
