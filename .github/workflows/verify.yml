name: Verify CloudSaver
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pip check
      - name: Unit and disposable PostgreSQL/Redis fault tests
        run: python scripts/test_postgres.py

  dashboard:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: web-dashboard
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      CLOUDSAVER_DASHBOARD_URL: http://127.0.0.1:3099
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web-dashboard/package-lock.json
      - run: npm ci
      - name: Dependency vulnerability gate
        run: npm audit --audit-level=moderate
      - run: npm run typecheck
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: Browser workflows with intercepted test-only API fixtures
        shell: bash
        run: |
          npx next start --hostname 127.0.0.1 --port 3099 > /tmp/cloudsaver-dashboard.log 2>&1 &
          dashboard_pid=$!
          trap 'kill "$dashboard_pid" 2>/dev/null || true' EXIT
          ready=false
          for attempt in {1..60}; do
            if curl --fail --silent http://127.0.0.1:3099/ > /dev/null; then ready=true; break; fi
            sleep 1
          done
          test "$ready" = true
          npm run test:e2e
