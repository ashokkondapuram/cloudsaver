# Optional: install an Ingress controller first (e.g. NGINX or AKS App Routing).
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: cloudsaver-api
  labels:
    app.kubernetes.io/name: cloudsaver-api
spec:
  ingressClassName: webapprouting
  rules:
    - host: cloudsaver.example.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: cloudsaver-api
                port:
                  number: 80
